[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.11.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vstreamer"
version = "1.0.0"
authors = [
  { name="SURYAKNIGHT17" },
]
description = "Ultra-Low-Latency, Hardware-Accelerated Video Pipeline, Transcoder & Virtual Device Engine"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.24.0",
    "psutil>=5.9.0"
]

[project.urls]
"Homepage" = "https://github.com/SURYAKNIGHT17/V_Streamer"
"Bug Tracker" = "https://github.com/SURYAKNIGHT17/V_Streamer/issues"
